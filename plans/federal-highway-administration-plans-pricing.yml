description: >-
  FHWA publishes no API plans and no pricing, and should not be expected to. It is a U.S.
  federal agency distributing open-source software: the V2X App API, V2X Hub and the CARMA
  components are free to obtain, free to deploy, and carry no metering, no keys and no
  commercial tiers. LTBP InfoBridge states outright that access is free and requires no
  username or password. This file replaces a 2026-05-04 bulk-sweep scaffold that invented
  Free / Professional / Enterprise tiers with fabricated quotas; none of them ever existed.
