description: >-
  FHWA bills nothing for its APIs. There is no invoice, no metering, no currency and no
  chargeback relationship between FHWA and a consumer: FHWA publishes open-source software
  that the consumer deploys on their own infrastructure. This file replaces a 2026-05-04
  bulk-sweep scaffold that asserted a USD, monthly, usage-based billing model with
  per-request and egress meters — none of which exists.
applicability: not-applicable
reason: >-
  No FHWA-operated, metered API service exists. Cost accrues to whoever runs the containers,
  on their own cloud account, under their own FinOps practice — FHWA is not the invoice
  issuer.
billingModel:
  pricingCategory: none
  billingFrequency: null
  billingCurrency: null
  chargeCategories: []
  chargeFrequency: null
consumer_side_cost_drivers:
  note: >-
    Recorded for the operator who deploys this software, NOT as a charge FHWA levies. Read
    from the published docker-compose stack in usdot-fhwa-stol/v2x-app-api.
  components:
    - name: v2x-app-api
      kind: container
      note: Spring Boot service, port 8080.
    - name: keycloak
      kind: container
      note: OAuth2/OIDC provider, port 8084.
    - name: postgres
      kind: container
      note: PostgreSQL 17, port 5432 — registration logs, geofence deployments, limits.
    - name: kafka-producer
      kind: container
      note: >-
        Publishes a GeoHashRoutedMsg protobuf per active geofence at 1 Hz. Steady-state
        cost scales with the number of active geofences, not with API request volume.
  third_party_dependencies:
    - name: ETX / Verizon ThingSpace MEC
      note: >-
        The API deposits to an ETX MQTT broker (sample.env default endpoint
        https://imp.thingspace.verizon.com). Any commercial terms there belong to the
        operator and the vendor, not to FHWA.
apis:
  - name: FHWA V2X App API
    baseURL: null
    serviceName: V2X App API
    serviceCategory: API
    note: Self-hosted; no FHWA-operated endpoint exists.
