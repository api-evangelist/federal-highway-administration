  - aid: federal-highway-administration:v2x-app-api
    name: FHWA V2X App API
    tags:
      - V2X
      - Connected Vehicles
      - Cooperative Driving Automation
      - Geofencing
      - SAE J2735
    humanURL: https://github.com/usdot-fhwa-stol/v2x-app-api
    description: >-
      Open-source REST API published by the FHWA Saxton Transportation Operations
      Laboratory (STOL). It sits between mobile applications and a Multi-Access Edge
      Computing V2X broker, and provides Keycloak-backed authentication, ETX MQTT client
      registration, deposit of UPER-encoded SAE J2735 MAP and TIM messages scoped by
      GeoJSON geofences, J2735 decoding, GeoJSON path management, and per-vendor and
      per-user registration limits. 29 paths, 40 operations, 46 schemas, OpenAPI 3.1.0.
      FHWA operates NO public instance of this API — the contract's only server entry is
      the springdoc-generated http://localhost:8080 placeholder, and the operator supplies
      the base URL when they deploy the published container stack. baseURL is therefore
      deliberately null rather than guessed.
    properties:
      - url: openapi/federal-highway-administration-v2x-app-api-openapi.json
        type: OpenAPI
      - url: overlays/federal-highway-administration-v2x-app-api-overlay.yaml
        type: Overlay
      - url: grpc/federal-highway-administration-geohash-routed-msg.proto
        type: Protobuf
      - url: https://github.com/usdot-fhwa-stol/v2x-app-api
        type: SourceCode
