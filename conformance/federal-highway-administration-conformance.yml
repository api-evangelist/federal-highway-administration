    hosts_probed: [highways.dot.gov, infobridge.fhwa.dot.gov, gis.fhwa.dot.gov, fhwaapps.fhwa.dot.gov]
    github_code_search: 'org:usdot-fhwa-stol extension:wsdl'
    result: 0 results
    note: >-
      FHWA tests NTCIP 2306 SOAP conformance but publishes no SOAP contract of its own.
  - target: asyncapi
    github_code_search: 'org:usdot-fhwa-stol asyncapi'
    result: 0 results
    note: >-
      An event surface plainly exists — a Kafka topic carrying GeoHashRoutedMsg protobuf at
      1 Hz, and the ETX MQTT broker — but no AsyncAPI document describes it, so none is
      recorded. This is the single clearest artifact gap for an FHWA reader to close.
